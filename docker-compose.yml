services:
  web:
    build: .
    env_file: [.env]
    depends_on: [db]
    ports: ["8000:8000"]

  db:
    image: postgres:16
    env_file: [.env]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports: ["5433:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
