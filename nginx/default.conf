server {
    listen 80;

    # รองรับการเข้าผ่าน localhost, 127.0.0.1, และ IP จริง
    server_name localhost 127.0.0.1 202.28.49.122;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;   # <-- ตรงกับที่ mount
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;    # <-- ตรงกับที่ mount
        access_log off;
        expires 30d;
    }
}
